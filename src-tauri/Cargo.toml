[package]
name = "yellowsphere-tauri"
version = "1.6.7"
description = "Offline YellowSphere desktop app"
edition = "2021"

[lib]
name = "yellowsphere_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "yellowsphere"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
rfd = "0.15"
tauri = { version = "2", features = [] }
