[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yellowsphere"
version = "1.6.6"
description = "Offline YellowSphere-compatible BIP39/BIP32 recovery tool with PySide6 GUI and CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]

[project.scripts]
yellowsphere = "yellowsphere.cli:safe_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"yellowsphere.assets" = ["*.html", "*.js", "*.png"]
